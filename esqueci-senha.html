<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="senha.css">
</head>
<body>
    <div class="container">
        <h1>Recuperar Senha</h1>

        <form>
            <p>Após colocar seu e-mail você irá receber um código para criar sua nova senha</p>

            <div class="form-control">
                <label for="codigo">Código:</label>
                <input type="text" id="codigo" placeholder="Digite o código">
            </div>

            <div class="form-control">
                <div class="opcoes">
                    <input type="checkbox" id="lembrar" />
                    <label for="lembrar">Aceito receber o código por e-mail</label>
                </div>
            </div>
            

                <div class="form-control">
                    <button type="submit">Enviar Código</button>
                </div>

                <a href="login.html">Voltar para a tela de login</a>
            </div>


        </form>
    </div>
</body>
</html>
